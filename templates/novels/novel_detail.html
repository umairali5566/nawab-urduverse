{% extends 'base.html' %}
{% load static %}

{% block title %}{{ novel.title }} - {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="container my-4">
    <h1>{{ novel.title }}</h1>
    <p class="text-muted">By {{ novel.author.name }}</p>
    <div class="content">
        {{ novel.content|linebreaks }}
    </div>
    <a href="{% url 'novel_list' %}" class="btn btn-secondary">Back to Novels</a>
</div>
{% endblock %}
