<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete | {{ SITE_NAME }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { color-scheme: light; --brand-maroon:#6b1e2e; --brand-maroon-deep:#4d1020; --brand-gold:#d4af37; --brand-muted:#7e6769; --brand-text:#2e1b1f; }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; min-height: 100%; font-family: 'Manrope', sans-serif; background: linear-gradient(135deg, #fffaf7 0%, #f8efe5 45%, #f4e6d5 100%); color: var(--brand-text); }
        body { display: flex; align-items: center; justify-content: center; }
        .auth-clean-shell { width: min(440px, calc(100% - 1rem)); margin: 0 auto; padding: 1rem 0 2rem; }
        .auth-clean-card { background: rgba(255,255,255,0.94); border: 1px solid rgba(107,30,46,0.12); border-radius: 24px; box-shadow: 0 18px 40px rgba(76,20,33,0.12); padding: 1.1rem; text-align: center; }
        .page-kicker { display:inline-flex; align-items:center; gap:.45rem; border-radius:999px; padding:.42rem .72rem; background: rgba(107,30,46,0.08); color: var(--brand-maroon); font-size:.82rem; font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
        h1 { margin:.55rem 0 .2rem; font-size: clamp(1.7rem, 4vw, 2.2rem); line-height:1.12; color: var(--brand-maroon-deep); }
        .auth-lead { color: var(--brand-muted); font-size: .98rem; line-height: 1.65; margin-bottom: .8rem; }
        .success-icon { font-size: 4rem; color: #22c55e; margin-bottom: 1rem; }
        .btn { display:inline-flex; align-items:center; justify-content:center; width:100%; border-radius: 14px; border:0; padding:.9rem 1rem; font-weight:800; text-decoration:none; cursor:pointer; background: linear-gradient(135deg, var(--brand-maroon), var(--brand-maroon-deep)); color:#fff; box-shadow: 0 14px 28px rgba(107,30,46,0.2); }
        .form-note { margin-top:.75rem; text-align:center; color:var(--brand-muted); font-size:.95rem; }
        .auth-footer-link { color: var(--brand-maroon); font-weight:700; text-decoration:none; }
    </style>
</head>
<body>
    <main class="auth-clean-shell">
        <section class="auth-clean-card">
            <span class="page-kicker">Password Reset Complete / پاس ورڈ ری سیٹ مکمل</span>
            <div class="success-icon"><i class="bi bi-shield-check"></i></div>
            <h1>Password Changed Successfully</h1>
            <p class="auth-lead">آپ کا پاس ورڈ کامیابی سے تبدیل کر دیا گیا ہے۔ اب آپ اپنے نئے پاس ورڈ سے لاگ ان کر سکتے ہیں۔</p>
            <a href="{% url 'login' %}" class="btn"><i class="bi bi-box-arrow-in-right me-2"></i>Log In / لاگ ان کریں</a>
            <p class="form-note">پاس ورڈ یاد رکھیں یا محفوظ جگہ پر نوٹ کر لیں۔</p>
        </section>
    </main>
</body>
</html>
