{% load static %}
<header class="navbar-sticky">
    <div class="container">
        <nav class="navbar">
            <div class="navbar-logo">
                <a href="{% url 'home' %}">{{ SITE_NAME }}</a>
            </div>
            <ul class="navbar-menu">
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'poetry_list' %}">Poetry</a></li>
                <li><a href="{% url 'novel_list' %}">Novels</a></li>
                <li><a href="{% url 'story_list' %}">Stories</a></li>
                <li><a href="{% url 'quote_list' %}">Quotes</a></li>
                <li><a href="{% url 'blog_list' %}">Blog</a></li>
                <li><a href="{% url 'video_list' %}">Videos</a></li>
                <li><a href="{% url 'all_categories' %}">Categories</a></li>
                <li><a href="{% url 'search' %}">Search</a></li>
            </ul>
            <div class="navbar-auth">
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}">Dashboard</a>
                    <a href="{% url 'logout' %}">Logout</a>
                    {% if user.is_superuser %}
                        <a href="{% url 'admin:index' %}">Admin</a>
                    {% endif %}
                {% else %}
                    <a href="{% url 'login' %}">Login</a>
                    <a href="{% url 'register' %}">Register</a>
                {% endif %}
            </div>
            <button class="navbar-toggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
        </nav>
    </div>
</header>
