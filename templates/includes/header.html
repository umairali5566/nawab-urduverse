{% load static %}
<header class="site-navbar">
    <div class="main-container nav-shell">
        <a class="nav-brand" href="{% url 'home' %}">
            <img src="{% static 'images/nawab-logo.png' %}" alt="{{ SITE_NAME }} logo" class="nav-brand-mark" loading="eager">
            <div class="nav-brand-copy">
                <span class="nav-brand-title">{{ SITE_NAME }}</span>
                <span class="nav-brand-subtitle">Curated Urdu literature</span>
            </div>
        </a>

        <nav class="nav-links" aria-label="Primary">
            <a class="nav-link {% if '/home/' == request.path or request.path == '/' %}active{% endif %}" href="{% url 'home' %}">Home</a>
            <a class="nav-link {% if '/poetry/' in request.path %}active{% endif %}" href="{% url 'poetry_list' %}">Poetry</a>
            <a class="nav-link {% if '/novels/' in request.path %}active{% endif %}" href="{% url 'novel_list' %}">Novels</a>
            <a class="nav-link {% if '/stories/' in request.path %}active{% endif %}" href="{% url 'story_list' %}">Stories</a>
            <a class="nav-link {% if '/quotes/' in request.path %}active{% endif %}" href="{% url 'quote_list' %}">Quotes</a>
            <a class="nav-link {% if '/blog/' in request.path %}active{% endif %}" href="{% url 'blog_list' %}">Blog</a>
            <a class="nav-link {% if '/videos/' in request.path %}active{% endif %}" href="{% url 'video_list' %}">Videos</a>
            <a class="nav-link {% if '/categories/' in request.path %}active{% endif %}" href="{% url 'all_categories' %}">Categories</a>
            <a class="nav-link {% if '/search/' in request.path %}active{% endif %}" href="{% url 'search' %}">Search</a>
            {% if user.is_authenticated %}
            <a class="nav-link {% if '/dashboard/' in request.path %}active{% endif %}" href="{% url 'dashboard' %}">Dashboard</a>
            {% else %}
            <a class="nav-link {% if '/accounts/login/' in request.path %}active{% endif %}" href="{% url 'login' %}">Login</a>
            <a class="nav-link {% if '/accounts/register/' in request.path %}active{% endif %}" href="{% url 'register' %}">Register</a>
            {% endif %}
        </nav>
    </div>
</header>
