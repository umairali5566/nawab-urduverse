{% extends "base.html" %}
{% load static %}

{% block title %}ہوم - {{ SITE_NAME }}{% endblock %}

{% block content %}

<!-- HERO SECTION -->
<section class="hero-section">
    <div class="hero-content">
        <h1 class="hero-title">اردو ادب کی خوبصورت دنیا</h1>
        <div class="hero-buttons">
            <a href="{% url 'poetry_list' %}" class="btn btn-primary">شاعری دریافت کریں</a>
            <a href="{% url 'novel_list' %}" class="btn btn-secondary">ناول پڑھیں</a>
        </div>
    </div>
</section>

<!-- CATEGORIES SECTION -->
<section class="section">
    <h2 class="section-title">زمرے</h2>
    <div class="cards-grid-4">
        <a href="{% url 'poetry_list' %}" class="card">
            <div class="card-icon">✍️</div>
            <h3 class="card-title">شاعری</h3>
        </a>
        <a href="{% url 'novel_list' %}" class="card">
            <div class="card-icon">📖</div>
            <h3 class="card-title">ناول</h3>
        </a>
        <a href="{% url 'story_list' %}" class="card">
            <div class="card-icon">📚</div>
            <h3 class="card-title">کہانیاں</h3>
        </a>
        <a href="{% url 'quote_list' %}" class="card">
            <div class="card-icon">💬</div>
            <h3 class="card-title">اقتباسات</h3>
        </a>
    </div>
</section>

{% endblock %}
