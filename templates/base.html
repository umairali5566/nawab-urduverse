{% load static %}
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{{ SITE_DESCRIPTION }}{% endblock %}">

    <!-- Fonts and Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/ui-refresh.css' %}">
    <link rel="stylesheet" href="{% static 'css/dark-mode.css' %}" id="dark-mode-css" disabled>
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<body
    class="site-shell {% if user.is_authenticated and user.dark_mode %}dark-mode{% endif %}"
    data-authenticated="{% if user.is_authenticated %}true{% else %}false{% endif %}"
    data-login-url="{% url 'login' %}"
    data-register-url="{% url 'register' %}"
    data-site-name="{{ SITE_NAME }}"
    data-username="{% if user.is_authenticated %}{{ user.username }}{% endif %}"
>
    <div class="site-orb site-orb-one" aria-hidden="true"></div>
    <div class="site-orb site-orb-two" aria-hidden="true"></div>

    {% include "includes/header.html" %}

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    {% include "includes/footer.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <script src="/static/js/scripts.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
